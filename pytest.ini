# =============================================================================
# pytest configuration — actual config lives in pyproject.toml
# [tool.pytest.ini_options]. This file exists for tools that only read
# pytest.ini (e.g., some IDE integrations) and provides a single fallback.
# =============================================================================
[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts =
    -ra
    --strict-markers
    --strict-config
    --showlocals
    --tb=short
markers =
    unit: Unit tests (fast, no external services)
    integration: Integration tests (require DB/Redis/Prometheus)
    e2e: End-to-end tests
    slow: Slow running tests
    ml: Machine learning tests
