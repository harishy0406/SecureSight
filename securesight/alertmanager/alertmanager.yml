# =============================================================================
# SecureSight — AlertManager Configuration
# =============================================================================

global:
  resolve_timeout: 5m
  smtp_smarthost: "${SMTP_HOST:-smtp.gmail.com}:${SMTP_PORT:-587}"
  smtp_from: "${SMTP_FROM:-securesight-alerts@example.com}"
  smtp_auth_username: "${SMTP_USER:-}"
  smtp_auth_password: "${SMTP_PASSWORD:-}"
  smtp_require_tls: true
  slack_api_url: "${SLACK_WEBHOOK_URL:-}"
  pagerduty_url: "https://events.pagerduty.com/v2/enqueue"

route:
  receiver: "default"
  group_by: ["alertname", "severity", "team"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match:
        severity: critical
      receiver: "critical"
      repeat_interval: 1h
      continue: true

    - match:
        team: infrastructure
      receiver: "infra-team"
      repeat_interval: 2h

    - match:
        team: backend
      receiver: "backend-team"
      repeat_interval: 2h

    - match:
        team: database
      receiver: "database-team"
      repeat_interval: 2h

    - match:
        team: ml
      receiver: "ml-team"
      repeat_interval: 4h

    - match_re:
        severity: ^(warning|info)$
      receiver: "default"
      repeat_interval: 8h

receivers:
  - name: "default"
    email_configs:
      - to: "${ALERT_EMAIL_TO:-admin@example.com}"
        send_resolved: true
        headers:
          subject: '{{ template "email.default.subject" . }}'

  - name: "critical"
    email_configs:
      - to: "${ALERT_EMAIL_TO:-admin@example.com}"
        send_resolved: true
        headers:
          subject: '[CRITICAL] {{ .GroupLabels.alertname }}'
    pagerduty_configs:
      - routing_key: "${PAGERDUTY_INTEGRATION_KEY:-}"
        severity: critical
        send_resolved: true

  - name: "infra-team"
    slack_configs:
      - channel: "${SLACK_INFRA_CHANNEL:-#infra-alerts}"
        send_resolved: true
        title: '{{ template "slack.title" . }}'
        text: '{{ template "slack.text" . }}'

  - name: "backend-team"
    slack_configs:
      - channel: "${SLACK_BACKEND_CHANNEL:-#backend-alerts}"
        send_resolved: true
        title: '{{ template "slack.title" . }}'
        text: '{{ template "slack.text" . }}'

  - name: "database-team"
    slack_configs:
      - channel: "${SLACK_DB_CHANNEL:-#database-alerts}"
        send_resolved: true
        title: '{{ template "slack.title" . }}'
        text: '{{ template "slack.text" . }}'

  - name: "ml-team"
    slack_configs:
      - channel: "${SLACK_ML_CHANNEL:-#ml-alerts}"
        send_resolved: true
        title: '{{ template "slack.title" . }}'
        text: '{{ template "slack.text" . }}'

  - name: "webhook"
    webhook_configs:
      - url: "${WEBHOOK_URL:-}"
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ["alertname", "instance"]

templates:
  - "/etc/alertmanager/templates/*.tmpl"
