# =============================================================================
# SecureSight — Prometheus Configuration
# =============================================================================

global:
  scrape_interval:     15s
  evaluation_interval: 15s
  scrape_timeout:      10s
  external_labels:
    monitor: "securesight"
    environment: "${APP_ENV:-development}"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
      scheme: http
      timeout: 10s
      api_version: v2

rule_files:
  - "/etc/prometheus/rules/alert_rules.yml"
  - "/etc/prometheus/rules/recording_rules.yml"

scrape_configs:
  - job_name: "securesight-api"
    metrics_path: "/metrics"
    scheme: http
    static_configs:
      - targets:
          - api:8000
        labels:
          service: "api"
          component: "backend"

  - job_name: "node-exporter"
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          service: "infrastructure"
          component: "node-exporter"

  - job_name: "prometheus"
    static_configs:
      - targets:
          - localhost:9090
        labels:
          service: "infrastructure"
          component: "prometheus"

  - job_name: "alertmanager"
    static_configs:
      - targets:
          - alertmanager:9093
        labels:
          service: "infrastructure"
          component: "alertmanager"

  - job_name: "cadvisor"
    scrape_interval: 30s
    static_configs:
      - targets:
          - cadvisor:8080
        labels:
          service: "containers"
          component: "cadvisor"

  - job_name: "postgres-exporter"
    static_configs:
      - targets:
          - postgres-exporter:9187
        labels:
          service: "database"
          component: "postgres"

  - job_name: "redis-exporter"
    static_configs:
      - targets:
          - redis-exporter:9121
        labels:
          service: "cache"
          component: "redis"

  - job_name: "grafana"
    static_configs:
      - targets:
          - grafana:3000
        labels:
          service: "visualization"
          component: "grafana"
