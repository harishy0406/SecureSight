# =============================================================================
# SecureSight — Prometheus Recording Rules
# =============================================================================

groups:
  - name: securesight_recording_api
    interval: 60s
    rules:
      - record: job:api_request_duration_seconds:p95
        expr: histogram_quantile(0.95, sum(rate(api_request_duration_seconds_bucket[5m])) by (le))

      - record: job:api_request_duration_seconds:p99
        expr: histogram_quantile(0.99, sum(rate(api_request_duration_seconds_bucket[5m])) by (le))

      - record: job:api_error_rate:ratio_5m
        expr: sum(rate(api_errors_total[5m])) / sum(rate(api_requests_total[5m]))

      - record: job:api_request_rate:per_second
        expr: sum(rate(api_requests_total[5m]))

  - name: securesight_recording_infra
    interval: 120s
    rules:
      - record: instance:node_cpu_utilization:ratio
        expr: 1 - avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))

      - record: instance:node_memory_utilization:ratio
        expr: 1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)

      - record: instance:node_disk_utilization:ratio
        expr: 1 - (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"})

      - record: instance:node_load_1m:avg
        expr: avg by(instance) (node_load1)

      - record: instance:node_network_receive_bytes:rate_5m
        expr: sum by(instance) (rate(node_network_receive_bytes_total[5m]))

      - record: instance:node_network_transmit_bytes:rate_5m
        expr: sum by(instance) (rate(node_network_transmit_bytes_total[5m]))

  - name: securesight_recording_celery
    interval: 120s
    rules:
      - record: celery:task_failure_rate:5m
        expr: rate(celery_task_failed_total[5m])

      - record: celery:task_success_rate:5m
        expr: rate(celery_task_succeeded_total[5m])

      - record: celery:task_completion_rate:5m
        expr: rate(celery_task_succeeded_total[5m]) + rate(celery_task_failed_total[5m])

  - name: securesight_recording_anomaly
    interval: 300s
    rules:
      - record: anomaly:detection_rate:15m
        expr: rate(anomaly_events_total[15m])

      - record: anomaly:severity_breakdown:count
        expr: sum by(severity) (anomaly_events_total)
