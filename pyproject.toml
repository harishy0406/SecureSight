[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "securesight"
version = "1.0.0"
description = "AI-Powered Infrastructure Monitoring and Observability Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "SecureSight Product Team" }]
keywords = [
    "monitoring",
    "observability",
    "anomaly-detection",
    "prometheus",
    "grafana",
    "fastapi",
    "kubernetes",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Framework :: Pydantic",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: System Administrators",
    "License :: Other/Proprietary License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
]

[project.scripts]
securesight-api = "securesight.api.main:run"
securesight-worker = "securesight.api.workers.celery_app:run_worker"
securesight-beat = "securesight.api.workers.celery_app:run_beat"

[tool.setuptools.packages.find]
where = ["."]
include = ["securesight*"]
exclude = ["tests*", "scripts*", "docs*", "migrations*", "k8s*", "grafana*", "prometheus*", "alertmanager*"]

# =============================================================================
# Ruff (linter + formatter backup)
# =============================================================================
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    ".venv",
    "build",
    "dist",
    "securesight/ml/models",
    "migrations/versions",
    "k8s",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "S",   # flake8-bandit (security)
    "T20", # flake8-print
    "RUF", # ruff-specific
    "ASYNC", # flake8-async
    "PIE",   # flake8-pie
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # function calls in argument defaults
    "S101", # assert usage (tests use asserts)
    "S104", # hardcoded bind all interfaces (containers)
    "S105", # hardcoded password string
    "S106", # hardcoded password in argument
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "B", "N", "T20"]
"scripts/**/*.py" = ["T201", "S"]
"migrations/**/*.py" = ["E", "F", "I", "N", "UP", "B"]
"securesight/ml/models/**" = ["F", "E", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# =============================================================================
# Black
# =============================================================================
[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.venv
  | build
  | dist
  | migrations/versions
  | securesight/ml/models
)/
'''

# =============================================================================
# isort
# =============================================================================
[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["securesight"]

# =============================================================================
# mypy
# =============================================================================
[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = [
    "migrations/",
    "tests/",
    "scripts/",
    "build/",
    "dist/",
    "k8s/",
]

[[tool.mypy.overrides]]
module = [
    "prophet.*",
    "statsmodels.*",
    "sklearn.*",
    "scipy.*",
    "pandas.*",
    "numpy.*",
]
ignore_missing_imports = true

# =============================================================================
# pytest
# =============================================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "--tb=short",
]
markers = [
    "unit: unit tests (fast, no external services)",
    "integration: integration tests (require DB/Redis/Prometheus)",
    "e2e: end-to-end tests",
    "slow: slow running tests",
    "ml: machine learning tests",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:celery.*",
    "ignore::DeprecationWarning:kombu.*",
    "ignore::PendingDeprecationWarning",
]

# =============================================================================
# Coverage
# =============================================================================
[tool.coverage.run]
branch = true
source = ["securesight"]
omit = [
    "securesight/ml/models/*",
    "migrations/*",
    "tests/*",
    "scripts/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
show_missing = true
skip_covered = false
fail_under = 80
